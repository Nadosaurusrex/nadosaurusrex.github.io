<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Writing</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="RSS feed">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author | escape }}</span>
      <span class="sep">&middot;</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
  <script data-goatcounter="https://access.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
