# UI strings for the two editions of the site. Read by _includes/lang.html,
# _includes/post-list.html, _includes/date.html, the layouts and the two home pages.
# English is the site default (site.lang, hreflang x-default); Italian lives under /it/.
# Path values are deliberately unquoted. Reader-facing wording: blog desk / CONVENTION_en.md.
en:
  code: EN
  name: English
  home_url: /
  about_url: /about/
  nav_writing: Writing
  nav_about: About
  switch_label: Language
  switch_title: Read the site in English
  as_original: "Also in Italian."
  as_translation: "Written in Italian; this is the English edition."
  link_to_twin: "Leggi in italiano →"
  other_lang_tag: in Italian
  months_long: [January, February, March, April, May, June, July, August, September, October, November, December]
  months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
it:
  code: IT
  name: Italiano
  home_url: /it/
  about_url: /about/
  about_hreflang: en        # the About page is English-only for now; drop this line when it/about.md ships and about_url becomes /it/about/
  nav_writing: Scritti
  nav_about: Chi sono
  switch_label: Lingua
  switch_title: Leggi il sito in italiano
  as_original: "Scritto in italiano."
  as_translation: "Scritto in inglese; questa è l'edizione italiana."
  link_to_twin: "Read in English →"
  other_lang_tag: in inglese
  months_long: [gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre]
  months_short: [gen, feb, mar, apr, mag, giu, lug, ago, set, ott, nov, dic]
